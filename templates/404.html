<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | StockLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; background-color: #f4f6f8; 
            color: #111; display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; 
        }

        /* Subtle Grid */
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 40px 40px; pointer-events: none; z-index: -1;
        }

        .glass-card { 
            background: #ffffff; border-radius: 32px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04); 
            padding: 4rem 3rem; border: 1px solid rgba(0,0,0,0.03); text-align: center; 
            max-width: 500px; width: 90%; 
        }

        .error-code { 
            font-size: 7rem; font-weight: 800; letter-spacing: -0.05em; 
            line-height: 1; margin-bottom: 1rem; color: #111; 
        }

        .curvy-btn { 
            background-color: #000000; color: #ffffff; border-radius: 14px; 
            padding: 0.9rem 1.5rem; font-weight: 600; text-decoration: none; 
            transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 8px;
            margin-top: 1.5rem; 
        }
        
        .curvy-btn:hover { 
            transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            background-color: #1a1a1a; color: #fff;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="error-code">404</div>
        <h3 class="fw-bold mb-3 tracking-tight">Out of Stock!</h3>
        <p class="text-muted fw-medium mb-4">The page you're looking for doesn't exist, has been moved, or is currently unavailable.</p>
        
        <a href="{{ url_for('dashboard') }}" class="curvy-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Return to Dashboard
        </a>
    </div>
</body>
</html>
